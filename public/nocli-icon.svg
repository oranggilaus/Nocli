<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nocliGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#nocliGradient)" opacity="0.2"/>
  
  <!-- Main Shape - N -->
  <path d="M25 20 L25 80 L40 20 L45 20 L55 60 L65 20 L70 20 L70 80 L85 20 L85 80" 
        fill="url(#nocliGradient)" 
        filter="url(#glow)" 
        stroke="white" 
        stroke-width="1.5"/>
  
  <!-- AI Chip -->
  <rect x="35" y="40" width="30" height="20" rx="5" 
        fill="rgba(255,255,255,0.1)" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="1"/>
  <text x="50" y="52" text-anchor="middle" 
        fill="white" 
        font-size="8" 
        font-weight="bold">AI</text>
  
  <!-- Decorative Elements -->
  <circle cx="30" cy="30" r="3" fill="white" opacity="0.6"/>
  <circle cx="70" cy="30" r="3" fill="white" opacity="0.6"/>
  <circle cx="30" cy="70" r="3" fill="white" opacity="0.6"/>
  <circle cx="70" cy="70" r="3" fill="white" opacity="0.6"/>
</svg>
